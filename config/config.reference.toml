#
# Reference of the configuration of PVE SMART Alert.
#
# This file is documentation. The program reads /etc/pve-smart-alert/config.toml
# and nothing else, and copying this file over the configuration file changes
# nothing: every key appears here with the value it has when it is not set
# (ADR 0011).
#
# The values are kept in step with the program by tests, and the file grows
# with the key that arrives.

[notify]
# How a notification leaves the host (FR-506).
#   auto        the notify bridge, and mail to root when the bridge fails
#   pve-notify  the notify bridge only
#   mail        mail to root only
transport = "auto"

[smartctl]
# The smartctl program (ADR 0004). Tests and acceptance runs can point it at
# a fake smartctl that replays recordings (ADR 0016).
path = "/usr/sbin/smartctl"
# How long one call of smartctl may take, from "1s" to "15m". A drive that
# does not answer in time counts as unreadable in this run, and the run goes
# on with the next drive (FR-202).
timeout = "30s"
# How much smartctl reads (ADR 0004).
#   extended  smartctl --xall, with the device statistics and the SCT data
#   basic     smartctl --all, for hardware that reacts badly to the extended logs
detail = "extended"

[discovery]
# Devices that the scan of smartctl does not find, each with its device name
# and its smartctl device type (FR-104). There are none by default. One entry
# looks like this:
#
#   [[discovery.device]]
#   name = "/dev/sg3"
#   type = "areca,2"
device = []

# Drives that are not monitored. Each rule selects drives by exactly one of
# model, serial or wwn (ADR 0024). A model is a pattern in which * stands for
# any characters and ? for one, matched against the whole name, with upper
# and lower case counting; serial and wwn are compared exactly. An excluded
# drive is shown by `pve-smart-alert scan` with the reason "excluded". None
# by default. For example:
#
#   exclude = [
#       { model = "QEMU HARDDISK" },
#       { serial = "S2R5NX0H123456A" },
#   ]
exclude = []
