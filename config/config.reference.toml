# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Reference of the configuration of PVE SMART Alert.
#
# This file is documentation. The program reads /etc/pve-smart-alert/config.toml
# and nothing else, and copying this file over the configuration file changes
# nothing: every key appears here with the value it has when it is not set
# (ADR 0011).
#
# The values are kept in step with the program by tests, and the file grows
# with the key that arrives.

[notify]
# How a notification leaves the host (FR-506).
#   auto        the notify bridge, and mail to root when the bridge fails
#   pve-notify  the notify bridge only
#   mail        mail to root only
transport = "auto"

# The notification policy (ADR 0009). A condition is notified once, again when
# its severity rises, when its value worsens and the cool-down has passed, and
# as a reminder after the interval of its severity; an event, an increase of
# a cumulative counter, is notified when the counter rises above its baseline.
#
# When more drives than this have a notification due in one run, one summary
# is sent instead of one notification per drive (FR-515).
max_drive_notifications = 3
# One notification with severity info when a condition has cleared (FR-513).
recovery = true
# One summary on the first run, which lists the drives and what they already
# have, instead of a notification per finding (FR-516).
first_run_summary = true
# A value that worsens at the same severity is notified at most once per this
# time and drive (FR-512). A rise in severity is never held back.
worsening_cooldown = "6h"
# A counter that rises is notified at most once per this time, drive and
# check.
event_cooldown = "24h"
# In how many runs in a row a condition has to be absent before it counts as
# cleared.
clear_runs = 2
# In how many runs in a row a known drive has to be absent before it is
# reported as missing (FR-309), and has to answer without usable data before
# it is reported as unreadable (FR-310).
missing_runs = 2
unreadable_runs = 2

[notify.reminder]
# How long an unchanged condition waits before it is notified again, per
# severity (FR-510). "never" switches the reminder off; the shortest interval
# is "1h".
critical = "3d"
warning = "7d"
notice = "never"

[smartctl]
# The smartctl program (ADR 0004). Tests and acceptance runs can point it at
# a fake smartctl that replays recordings (ADR 0016).
path = "/usr/sbin/smartctl"
# How long one call of smartctl may take, from "1s" to "15m". A drive that
# does not answer in time counts as unreadable in this run, and the run goes
# on with the next drive (FR-202).
timeout = "30s"
# How much smartctl reads (ADR 0004).
#   extended  smartctl --xall, with the device statistics and the SCT data
#   basic     smartctl --all, for hardware that reacts badly to the extended logs
# With basic the wear of an SSD comes from a vendor attribute, because the
# device statistics that carry the vendor-neutral value are not read
# (Research 03, docs/research/ in the repository).
detail = "extended"

[discovery]
# Whether the drives behind an HPE Smart Array controller are found by probing
# `cciss,N` on the SCSI generic node of the controller (FR-103, ADR 0032).
# The probe is experimental in version 1: it runs only on hosts with the driver
# hpsa, reads the device IDs from 0 upwards and stops after 3 in a row that
# answer nothing. A controller with the driver smartpqi is named by `scan` and
# `doctor` and is not probed; its drives can be added as [[discovery.device]].
probe_cciss = true

# Devices that the scan of smartctl does not find, each with its device name
# and its smartctl device type (FR-104). There are none by default. One entry
# looks like this:
#
#   [[discovery.device]]
#   name = "/dev/sg3"
#   type = "areca,2"
device = []

# Drives that are not monitored. Each rule selects drives by exactly one of
# model, serial or wwn (ADR 0024). A model is a pattern in which * stands for
# any characters and ? for one, matched against the whole name, with upper
# and lower case counting; serial and wwn are compared exactly. An excluded
# drive is shown by `pve-smart-alert scan` with the reason "excluded". None
# by default. For example:
#
#   exclude = [
#       { model = "QEMU HARDDISK" },
#       { serial = "S2R5NX0H123456A" },
#   ]
exclude = []

# The checks of the catalog, each with its default thresholds
# (docs/check-catalog.md). Every threshold and the enabled state can be
# overridden here for the whole host, and per drive in [[drive]]. A severity
# that a check does not use by default can be set just the same; wear, for
# example, never becomes critical by default (FR-307).
#
# A check of the kind condition also takes confirm_runs: in how many runs in
# a row it has to be seen before it is notified. It is 1 for every condition
# except the temperature, which needs 2 (FR-308).

[checks."health.failed"]
enabled = true

[checks."selftest.failed"]
enabled = true

[checks."temperature"]
# The limits differ per drive class; a table names them one by one, a single
# number counts for every class.
enabled = true
warning = { hdd = 50, ssd = 60, nvme = 70 }
critical = { hdd = 60, ssd = 70, nvme = 80 }
confirm_runs = 2

[checks."wear"]
enabled = true
notice = 80
warning = 95

[checks."smart.disabled"]
enabled = true

[checks."drive.unreadable"]
# A drive that answers without usable SMART data in notify.unreadable_runs
# runs in a row (FR-310).
enabled = true

[checks."drive.missing"]
# A known drive that is absent in notify.missing_runs runs in a row; never
# for removable and USB drives and drives without a serial number or WWN
# (FR-309).
enabled = true

[checks."ata.attribute_failing"]
enabled = true

[checks."ata.reallocated_sectors"]
enabled = true
notice = 1
warning = 5
critical = 70

[checks."ata.reported_uncorrectable"]
enabled = true
warning = 1
critical = 20

[checks."ata.command_timeouts"]
enabled = true
warning = 100

[checks."ata.pending_sectors"]
enabled = true
warning = 1
critical = 16

[checks."ata.offline_uncorrectable"]
enabled = true
warning = 1
critical = 10

[checks."ata.spin_retries"]
enabled = true
warning = 1

[checks."ata.end_to_end_errors"]
enabled = true
warning = 1

[checks."ata.crc_errors"]
enabled = true

[checks."ata.error_log"]
enabled = true

[checks."nvme.spare"]
# The warning threshold is the margin in points above the threshold of the
# drive itself.
enabled = true
warning = 15

[checks."nvme.reliability_degraded"]
enabled = true

[checks."nvme.read_only"]
enabled = true

[checks."nvme.backup_failed"]
enabled = true

[checks."nvme.pmr_unreliable"]
enabled = true

[checks."nvme.media_errors"]
enabled = true
warning = 1

[checks."nvme.thermal_excursion"]
enabled = true

[checks."nvme.error_log"]
# Off by default: many drives log harmless entries, and reading the log can
# add entries on some drives with smartmontools 7.4.
enabled = false

[checks."scsi.grown_defects"]
enabled = true
notice = 1
warning = 100

[checks."scsi.uncorrected_errors"]
enabled = true
warning = 1

[checks."scsi.pending_defects"]
enabled = true
warning = 1

# The conditions of the tool itself (docs/check-catalog.md). Their severity is
# fixed, so they take no threshold and no confirmation count; only the enabled
# state can be set (FR-408, ADR 0031). Switching one off stops its notice, and
# a condition that is active in the state is dropped without a recovery. The
# tool condition `tool.unsupported_controller` names a controller whose drives
# smartctl cannot read; a controller in HBA mode, whose drives all appear in
# the scan, is monitored and needs no notice:

[checks."tool.smartctl_missing"]
enabled = true

[checks."tool.smartctl_too_old"]
enabled = true

[checks."tool.scan_failed"]
enabled = true

[checks."tool.config_invalid"]
enabled = true

[checks."tool.state_reset"]
enabled = true

[checks."tool.transport_degraded"]
enabled = true

[checks."tool.unsupported_controller"]
enabled = true

# Overrides for one drive (FR-403). A drive is selected by exactly one of
# model, serial or wwn, with the same meaning as in the exclude rules above.
# The first entry that matches a drive wins. An entry can exclude the drive
# from monitoring, name another smartctl detail level for it, and override
# any check for it. There are none by default. One entry looks like this:
#
#   [[drive]]
#   serial = "S4EWNX0M123456A"
#   comment = "Worn, replacement ordered"
#   exclude = false
#   detail = "extended"
#
#   [drive.checks."wear"]
#   enabled = false
